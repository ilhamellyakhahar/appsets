apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: folder-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/ilhamellyakhahar/appsets.git
        revision: main
        directories:
          - path: apps/*
  template:
    metadata:
      name: '{{path.basename}}'
      labels:
        managed-by: applicationset
        source: git-directories
    spec:
      project: default
      source:
        repoURL: https://github.com/ilhamellyakhahar/appsets.git
        targetRevision: main
        path: '{{path}}'
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true